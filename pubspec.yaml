name: sleep_quality_predictor
description: "An AI-Based Cross-Platform Flutter Application integrating TensorFlow Lite (TFLite) for On-Device Sleep Quality Prediction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sleep_quality.tflite